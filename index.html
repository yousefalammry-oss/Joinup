<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <title>إيوان | IWAN VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;500;700&display=swap');
        
        body { 
            font-family: 'Noto Kufi Arabic', sans-serif; 
            background-color: #050505; 
            color: #C5A059; 
            margin: 0; 
            /* منع التمرير المطاطي للمتصفح */
            overflow: hidden; 
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .gold-bg { background: linear-gradient(135deg, #C5A059 0%, #8E6D3B 100%); }
        .glass { background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(197, 160, 89, 0.15); }
        
        /* ضبط الحاوية لتشغل الشاشة كاملة بدون إطارات صناعية */
        #app-wrapper {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            /* دعم المساحات الآمنة في الآيفون (النوتش ومنطقة السحب) */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .view-container { flex: 1; overflow-y: auto; padding: 1.5rem; }
        
        /* تحسين مظهر شريط التنقل السفلي ليكون ملتصقاً بالأسفل تماماً */
        #bottom-nav {
            height: 80px;
            display: flex;
            justify-content: around;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(197, 160, 89, 0.2);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; opacity: 0.5; transition: 0.3s; }
        .nav-item.active { opacity: 1; color: #C5A059; }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="app-wrapper">
        
        <div id="screen-auth" class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-black px-10">
            <div class="text-center mb-12">
                <div class="w-20 h-20 border border-[#C5A059] rounded-2xl mx-auto flex items-center justify-center mb-4">
                    <span class="text-4xl">إ</span>
                </div>
                <h1 class="text-2xl font-bold tracking-[0.2em]">إيوان</h1>
            </div>
            <button onclick="unlockApp()" class="w-full py-4 gold-bg text-black font-bold rounded-xl shadow-lg active:scale-95 transition-transform">
                فتح البوابة الرقمية
            </button>
        </div>

        <div id="main-app" class="hidden flex-1 flex flex-col h-full">
            
            <main class="view-container">
                <div id="view-home" class="view fade-in">
                    <header class="mb-8">
                        <p class="text-xs opacity-50">مرحباً بك،</p>
                        <h2 class="text-2xl font-bold text-white uppercase">أصحاب السعادة</h2>
                    </header>

                    <div class="glass p-5 rounded-2xl mb-6">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                            <span class="text-[10px] font-bold">موجز استراتيجي - حي</span>
                        </div>
                        <h3 class="text-white text-sm font-bold">تحديث الأسواق العالمية</h3>
                        <p class="text-[11px] opacity-70 mt-2">تنامي الفرص في قطاع التقنية المالية السعودي..</p>
                    </div>

                    <div class="space-y-4">
                        <p class="text-[10px] tracking-widest opacity-40 uppercase">الوصول السريع</p>
                        <div class="glass p-4 rounded-xl flex justify-between items-center">
                            <span class="text-sm text-white font-bold">خزينة الفرص</span>
                            <span class="text-xs">←</span>
                        </div>
                        <div class="glass p-4 rounded-xl flex justify-between items-center">
                            <span class="text-sm text-white font-bold">المجلس (Discussion)</span>
                            <span class="text-xs">←</span>
                        </div>
                    </div>
                </div>
            </main>

            <nav id="bottom-nav">
                <button class="nav-item active">
                    <span class="text-xl">🏛️</span>
                    <span class="text-[9px] mt-1">الرئيسية</span>
                </button>
                <button class="nav-item">
                    <span class="text-xl">💎</span>
                    <span class="text-[9px] mt-1">الخزينة</span>
                </button>
                <button class="nav-item">
                    <span class="text-xl">🤝</span>
                    <span class="text-[9px] mt-1">المجلس</span>
                </button>
            </nav>
        </div>
    </div>

    <script>
        function unlockApp() {
            document.getElementById('screen-auth').style.display = 'none';
            document.getElementById('main-app').classList.remove('hidden');
        }

        // منع سحب الصفحة للأسفل لتحديثها (Pull to Refresh) في سفاري
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.view-container')) return;
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
